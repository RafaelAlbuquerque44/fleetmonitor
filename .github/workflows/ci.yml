name: FleetMonitor CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetmonitor_admin
          POSTGRES_PASSWORD: integration_admin_password_only
          POSTGRES_DB: fleetmonitor_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetmonitor_admin -d fleetmonitor_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://fleetmonitor_admin:integration_admin_password_only@localhost:5432/fleetmonitor_integration
      DATABASE_URL: postgres://fleetmonitor_app:integration_application_password_only@localhost:5432/fleetmonitor_integration
      TEST_DATABASE_URL: postgres://fleetmonitor_app:integration_application_password_only@localhost:5432/fleetmonitor_integration
      POSTGRES_APP_USER: fleetmonitor_app
      POSTGRES_APP_PASSWORD: integration_application_password_only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install API dependencies
        working-directory: api
        run: bun install --frozen-lockfile
      - name: Provision application role
        working-directory: api
        run: bun run db:provision-app-role
      - name: Apply migrations
        working-directory: api
        run: bun run db:migrate
      - name: Typecheck and unit tests
        working-directory: api
        run: |
          bun run typecheck
          bun run test
      - name: PostgreSQL tenant integration test
        working-directory: api
        run: bun run test:integration
      - name: Build production API image
        run: docker build -f api/Dockerfile api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build web
        working-directory: web
        run: bun run build
      - name: Build production web image
        run: docker build -f web/Dockerfile web
