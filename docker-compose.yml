services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fleetmonitor}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-fleetmonitor_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetmonitor} -d ${POSTGRES_DB:-fleetmonitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-fleetmonitor_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fleetmonitor}
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  public-demo-seed:
    build: ./api
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-fleetmonitor_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fleetmonitor}
      NODE_ENV: production
      PUBLIC_DEMO_SEED_ENABLED: "false"
      PUBLIC_DEMO_EMAIL: ${PUBLIC_DEMO_EMAIL:-demo@fleetmonitor.invalid}
      PUBLIC_DEMO_PASSWORD: ${PUBLIC_DEMO_PASSWORD:-}
      PUBLIC_DEMO_COMPANY_NAME: ${PUBLIC_DEMO_COMPANY_NAME:-FleetMonitor Demo}
    depends_on:
      postgres:
        condition: service_healthy

  migrator:
    build: ./api
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-fleetmonitor_app}:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fleetmonitor}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-fleetmonitor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-fleetmonitor}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-fleetmonitor_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      DEMO_COMPANY_NAME: ${DEMO_COMPANY_NAME:-FleetMonitor Demo}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:
