services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetmonitor_admin
      POSTGRES_PASSWORD: integration_admin_password_only
      POSTGRES_DB: fleetmonitor_integration
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetmonitor_admin -d fleetmonitor_integration"]
      interval: 2s
      timeout: 5s
      retries: 20
